# The checks from DEVELOPMENT.md: tests, lint and formatting, and type checks.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt ruff mypy

      - name: Tests
        run: pytest

      - name: Lint
        run: ruff check custom_components tests

      - name: Formatting
        run: ruff format --check custom_components tests

      - name: Type checks
        run: mypy --strict custom_components/aligned_shade_group
