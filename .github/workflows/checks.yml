# The checks from DEVELOPMENT.md: tests, lint and formatting, and type checks.
# Separate jobs, so each reports on its own and one failing doesn't hide the
# others.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check custom_components tests

      - name: Formatting
        if: ${{ !cancelled() }}
        run: ruff format --check custom_components tests

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      # mypy needs Home Assistant installed to see its type hints.
      - name: Install dependencies
        run: pip install -r requirements_test.txt mypy

      - name: Type checks
        run: mypy --strict custom_components/aligned_shade_group
